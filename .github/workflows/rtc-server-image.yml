name: RTC Server Image

on:
  push:
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (defaults to git ref).
        required: false
        default: latest
      push_image:
        description: Push image to ghcr.io after build.
        required: true
        default: true
        type: boolean
      sdkwork_appbase_ref:
        description: sdkwork-appbase commit/ref.
        required: false
        default: main
      sdkwork_web_framework_ref:
        description: sdkwork-web-framework commit/ref.
        required: false
        default: main
      sdkwork_database_ref:
        description: sdkwork-database commit/ref.
        required: false
        default: main
      sdkwork_utils_ref:
        description: sdkwork-utils commit/ref.
        required: false
        default: main
      sdkwork_drive_ref:
        description: sdkwork-drive commit/ref.
        required: false
        default: main
      sdkwork_id_ref:
        description: sdkwork-id commit/ref.
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: rtc-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build RTC API Server Image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE_NAME: ghcr.io/sdkwork/rtc-api-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Prepare SDKWork source dependencies
        env:
          SDKWORK_RELEASE_TOKEN: ${{ secrets.SDKWORK_RELEASE_TOKEN || github.token }}
          SDKWORK_APPBASE_REF: ${{ github.event.inputs.sdkwork_appbase_ref || vars.SDKWORK_APPBASE_REF || 'main' }}
          SDKWORK_WEB_FRAMEWORK_REF: ${{ github.event.inputs.sdkwork_web_framework_ref || vars.SDKWORK_WEB_FRAMEWORK_REF || 'main' }}
          SDKWORK_DATABASE_REF: ${{ github.event.inputs.sdkwork_database_ref || vars.SDKWORK_DATABASE_REF || 'main' }}
          SDKWORK_UTILS_REF: ${{ github.event.inputs.sdkwork_utils_ref || vars.SDKWORK_UTILS_REF || 'main' }}
          SDKWORK_DRIVE_REF: ${{ github.event.inputs.sdkwork_drive_ref || vars.SDKWORK_DRIVE_REF || 'main' }}
          SDKWORK_ID_REF: ${{ github.event.inputs.sdkwork_id_ref || vars.SDKWORK_ID_REF || 'main' }}
        run: pnpm run workflow:prepare-ci-dependencies

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event.inputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ..
          file: sdkwork-rtc/deployments/docker/Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_image == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
