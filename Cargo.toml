[workspace]
resolver = "2"
members = [
    "adapters/rtc-aliyun",
    "adapters/rtc-agora",
    "adapters/rtc-tencent",
    "adapters/rtc-livekit",
    "adapters/rtc-volcengine",
    "crates/sdkwork-rtc-api-registry",
    "crates/sdkwork-rtc-app-context",
    "crates/sdkwork-rtc-core",
    "crates/sdkwork-rtc-openapi",
    "crates/sdkwork-rtc-storage-sqlx",
    "services/sdkwork-routes-rtc-app-api",
    "services/sdkwork-routes-rtc-backend-api",
    "services/sdkwork-rtc-product",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-SDKWork-Commercial"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.8" }
http-body-util = "0.1.3"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SDKWork workspace members - declared once at workspace root
sdkwork-rtc-api-registry = { path = "crates/sdkwork-rtc-api-registry" }
sdkwork-rtc-app-context = { path = "crates/sdkwork-rtc-app-context" }
sdkwork-rtc-core = { path = "crates/sdkwork-rtc-core" }
sdkwork-rtc-openapi = { path = "crates/sdkwork-rtc-openapi" }
sdkwork-rtc-adapter-agora = { path = "adapters/rtc-agora" }
sdkwork-rtc-adapter-aliyun = { path = "adapters/rtc-aliyun" }
sdkwork-rtc-adapter-livekit = { path = "adapters/rtc-livekit" }
sdkwork-rtc-adapter-tencent = { path = "adapters/rtc-tencent" }
sdkwork-rtc-adapter-volcengine = { path = "adapters/rtc-volcengine" }
sdkwork-routes-rtc-app-api = { path = "services/sdkwork-routes-rtc-app-api" }
sdkwork-routes-rtc-backend-api = { path = "services/sdkwork-routes-rtc-backend-api" }
