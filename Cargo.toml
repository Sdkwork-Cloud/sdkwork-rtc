[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-rtc-assembly",
    "crates/sdkwork-api-rtc-assembly",
    "plugins/rtc-aliyun",
    "plugins/rtc-agora",
    "plugins/rtc-tencent",
    "plugins/rtc-livekit",
    "plugins/rtc-volcengine",
    "crates/sdkwork-rtc-database-host",
    "crates/sdkwork-rtc-api-registry",
    "crates/sdkwork-rtc-app-context",
    "crates/sdkwork-communication-rtc-service",
    "crates/sdkwork-rtc-openapi",
    "crates/sdkwork-communication-rtc-repository-sqlx",
    "crates/sdkwork-routes-rtc-app-api",
    "crates/sdkwork-routes-rtc-backend-api",
    "crates/sdkwork-rtc-service-host",
    "crates/sdkwork-rtc-plugin-bootstrap",
    "crates/sdkwork-communication-rtc-worker",
    "crates/sdkwork-api-rtc-standalone-gateway",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.8" }
http-body-util = "0.1.3"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres", "json"] }

# SDKWork workspace members - declared once at workspace root
sdkwork-rtc-database-host = { path = "crates/sdkwork-rtc-database-host" }
sdkwork-rtc-api-registry = { path = "crates/sdkwork-rtc-api-registry" }
sdkwork-rtc-app-context = { path = "crates/sdkwork-rtc-app-context" }
sdkwork-communication-rtc-service = { path = "crates/sdkwork-communication-rtc-service" }
sdkwork-communication-rtc-repository-sqlx = { path = "crates/sdkwork-communication-rtc-repository-sqlx" }
sdkwork-rtc-openapi = { path = "crates/sdkwork-rtc-openapi" }
sdkwork-rtc-adapter-agora = { path = "plugins/rtc-agora" }
sdkwork-rtc-adapter-aliyun = { path = "plugins/rtc-aliyun" }
sdkwork-rtc-adapter-livekit = { path = "plugins/rtc-livekit" }
sdkwork-rtc-adapter-tencent = { path = "plugins/rtc-tencent" }
sdkwork-rtc-adapter-volcengine = { path = "plugins/rtc-volcengine" }
sdkwork-routes-rtc-app-api = { path = "crates/sdkwork-routes-rtc-app-api" }
sdkwork-routes-rtc-backend-api = { path = "crates/sdkwork-routes-rtc-backend-api" }
sdkwork-rtc-service-host = { path = "crates/sdkwork-rtc-service-host" }
sdkwork-rtc-plugin-bootstrap = { path = "crates/sdkwork-rtc-plugin-bootstrap" }
sdkwork-communication-rtc-worker = { path = "crates/sdkwork-communication-rtc-worker" }
sdkwork-api-rtc-standalone-gateway = { path = "crates/sdkwork-api-rtc-standalone-gateway" }
sdkwork-api-rtc-assembly = { path = "crates/sdkwork-api-rtc-assembly" }
sdkwork-drive-config = { path = "../sdkwork-drive/crates/sdkwork-drive-config" }
sdkwork-drive-storage-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-contract" }
sdkwork-drive-storage-local = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-local" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-repository = { path = "../sdkwork-database/crates/sdkwork-database-repository", package = "sdkwork-database-repository" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
