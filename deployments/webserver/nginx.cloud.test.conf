# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/rtc/webserver.pid;
error_log /var/log/sdkwork/rtc/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name rtc-test.sdkwork.com rtc-test.birdcoder.com rtc-test.dtupay.com rtc-test.noaper.com rtc-test.sdkwork.cn rtc-test.birdcoder.cn rtc-test.dtupay.cn rtc-test.noaper.cn rtc-test.skubc.com rtc-test.skubc.cn rtc-test.zowalk.com rtc-test.zowalk.cn rtc-test.offer86.com rtc-test.offer86.cn rtc-test.86offer.com rtc-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
