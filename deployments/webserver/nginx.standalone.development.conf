# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/rtc/webserver.pid;
error_log /var/log/sdkwork/rtc/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name rtc-dev.sdkwork.com rtc-dev.birdcoder.com rtc-dev.dtupay.com rtc-dev.sdkwork.cn rtc-dev.birdcoder.cn rtc-dev.dtupay.cn rtc-dev.skubc.com rtc-dev.skubc.cn rtc-dev.zowalk.com rtc-dev.zowalk.cn rtc-dev.offer86.com rtc-dev.offer86.cn rtc-dev.86offer.com rtc-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
