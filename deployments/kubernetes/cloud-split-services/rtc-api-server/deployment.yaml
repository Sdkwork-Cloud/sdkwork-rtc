apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtc-api-server
  namespace: sdkwork-rtc
  labels:
    app.kubernetes.io/name: rtc-api-server
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: sdkwork-rtc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rtc-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtc-api-server
        app.kubernetes.io/component: api-server
    spec:
      containers:
        - name: rtc-api-server
          image: ghcr.io/sdkwork/rtc-api-server:latest
          imagePullPolicy: IfNotPresent
          command:
            - /opt/sdkwork/rtc/bin/sdkwork-rtc-api-server
          ports:
            - name: http
              containerPort: 18088
          envFrom:
            - configMapRef:
                name: rtc-api-server-runtime
            - secretRef:
                name: rtc-api-server-secrets
                optional: true
          env:
            - name: SDKWORK_RTC_ENVIRONMENT
              value: production
            - name: SDKWORK_RTC_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_RTC_SERVICE_LAYOUT
              value: split-services
            - name: SDKWORK_RTC_APPLICATION_PUBLIC_INGRESS_BIND
              value: 0.0.0.0:18088
            - name: OTEL_SERVICE_NAME
              value: sdkwork-rtc-api-server
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
