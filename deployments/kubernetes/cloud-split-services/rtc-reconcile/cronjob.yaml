apiVersion: batch/v1
kind: CronJob
metadata:
  name: rtc-session-reconciliation
  namespace: sdkwork-rtc
  labels:
    app.kubernetes.io/name: rtc-reconcile
    app.kubernetes.io/component: maintenance-worker
    app.kubernetes.io/part-of: sdkwork-rtc
    sdkwork.io/job-id: rtc-session-reconciliation
spec:
  schedule: "*/15 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rtc-reconcile
            app.kubernetes.io/component: maintenance-worker
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rtc-reconcile
              image: ghcr.io/sdkwork/rtc-api-server:latest
              imagePullPolicy: IfNotPresent
              command:
                - /opt/sdkwork/rtc/bin/sdkwork-rtc-reconcile
              envFrom:
                - configMapRef:
                    name: rtc-reconcile-runtime
                - secretRef:
                    name: rtc-api-server-secrets
                    optional: true
              env:
                - name: SDKWORK_RTC_ENVIRONMENT
                  value: production
                - name: SDKWORK_RTC_DEPLOYMENT_PROFILE
                  value: cloud
                - name: SDKWORK_RTC_SERVICE_LAYOUT
                  value: split-services
                - name: OTEL_SERVICE_NAME
                  value: sdkwork-rtc-reconcile
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
