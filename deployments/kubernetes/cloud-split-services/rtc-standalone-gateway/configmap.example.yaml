apiVersion: v1
kind: ConfigMap
metadata:
  name: rtc-standalone-gateway-runtime
  namespace: sdkwork-rtc
data:
  SDKWORK_RTC_DATABASE_ENGINE: postgresql
  SDKWORK_RTC_DATABASE_HOST: db.example.com
  SDKWORK_RTC_DATABASE_PORT: "5432"
  SDKWORK_RTC_DATABASE_NAME: sdkwork_rtc
  SDKWORK_RTC_DATABASE_SCHEMA: public
  SDKWORK_RTC_DATABASE_SSL_MODE: require
  SDKWORK_RTC_DATABASE_MAX_CONNECTIONS: "20"
  SDKWORK_RTC_HYDRATE_TENANT_ID: "100"
  SDKWORK_RTC_HYDRATE_ORGANIZATION_ID: "0"
  SDKWORK_RTC_APP_CONTEXT_REQUIRE_SIGNATURE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
