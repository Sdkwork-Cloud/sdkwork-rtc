apiVersion: v1
kind: Service
metadata:
  name: rtc-standalone-gateway
  namespace: sdkwork-rtc
  labels:
    app.kubernetes.io/name: rtc-standalone-gateway
    app.kubernetes.io/component: standalone-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rtc-standalone-gateway
  ports:
    - name: http
      port: 18088
      targetPort: http
      protocol: TCP
