# Example standalone stack for integration testing. Copy and replace secrets before use.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: sdkwork_rtc
      POSTGRES_USER: sdkwork_rtc
      POSTGRES_PASSWORD: replace-with-strong-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdkwork_rtc -d sdkwork_rtc"]
      interval: 10s
      timeout: 5s
      retries: 5

  rtc-standalone-gateway:
    image: ghcr.io/sdkwork/rtc-standalone-gateway:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18088:18088"
    environment:
      SDKWORK_RTC_ENVIRONMENT: production
      SDKWORK_RTC_DEPLOYMENT_PROFILE: standalone
      SDKWORK_RTC_SERVICE_LAYOUT: split-services
      SDKWORK_RTC_APPLICATION_PUBLIC_INGRESS_BIND: 0.0.0.0:18088
      SDKWORK_RTC_DATABASE_ENGINE: postgresql
      SDKWORK_RTC_DATABASE_HOST: postgres
      SDKWORK_RTC_DATABASE_PORT: "5432"
      SDKWORK_RTC_DATABASE_NAME: sdkwork_rtc
      SDKWORK_RTC_DATABASE_SCHEMA: public
      SDKWORK_RTC_DATABASE_USERNAME: sdkwork_rtc
      SDKWORK_RTC_DATABASE_PASSWORD: replace-with-strong-password
      SDKWORK_RTC_DATABASE_SSL_MODE: disable
      SDKWORK_RTC_HYDRATE_TENANT_ID: "100"
      SDKWORK_RTC_HYDRATE_ORGANIZATION_ID: "0"
      SDKWORK_RTC_APP_CONTEXT_REQUIRE_SIGNATURE: "false"
